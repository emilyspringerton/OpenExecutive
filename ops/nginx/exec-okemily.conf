# exec.okemily.com — the real, public-facing OpenExecutive UI (S506, 2026-09-21). Founder: "im
# expecting to see the interface" -- the earlier IDUNA Back Office status/provisioning page
# (/admin/openexecutive) was never meant to BE the product interface, just an admin tool; this is
# the real one.
#
# DNS: A record pre-created this session (Cloudflare API), points at this host. Proxies straight
# to the Next.js UI (systemd: openexecutive-ui.service, 127.0.0.1:3000), which itself talks to the
# FastAPI backend (openexecutive-api.service, 127.0.0.1:8000, loopback only, never exposed here
# directly) via its own server-side proxy route + BACKEND_SHARED_SECRET.
#
# Auth is the UI's OWN (Auth.js/NextAuth + Google, packages/ui/src/middleware.ts) -- not IDUNA's
# cookie session. Deliberate, not an oversight: OpenExecutive is designed to be deployable
# standalone (without IDUNA at all), so it carries its own auth rather than assuming an IDUNA
# front door always exists; layering IDUNA's own gate in front wouldn't remove this app's own
# login screen anyway (middleware.ts enforces it unconditionally), so there's no real benefit to
# reusing IDUNA's session here the way console.okemily.com's code-server did.
#
# Deploy (see sudo-queue/87-exec-okemily-ui.sh):
#   sudo cp exec-okemily.conf /etc/nginx/sites-available/exec
#   sudo ln -sf /etc/nginx/sites-available/exec /etc/nginx/sites-enabled/exec
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d exec.okemily.com

server {
    server_name exec.okemily.com;

    # Real bug, found live (2026-09-21): "i tried to upload a 5mb document ... it failed."
    # nginx's own default client_max_body_size (1M) was never overridden here, so any knowledge
    # upload over 1MB got a 413 before ever reaching the Next.js proxy or the backend -- neither
    # of which impose their own limit (the Next.js proxy streams the request body unbuffered;
    # the FastAPI /documents route has no size cap of its own). Same exact class of bug
    # okemily.com's own config already hit and fixed for animation/texture uploads
    # (sudo-queue/80) -- same fix here.
    client_max_body_size 64M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/exec.okemily.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/exec.okemily.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = exec.okemily.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name exec.okemily.com;
    return 404; # managed by Certbot


}