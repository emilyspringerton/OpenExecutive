[project]
name = "openexecutive"
version = "0.1.0"
description = "AI-powered virtual executive team"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Open Executive Contributors"}]
dependencies = [
    "anthropic>=0.52.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "chromadb>=0.5.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "click>=8.1.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "slack-bolt>=1.18.0",
    "discord.py>=2.4.0",
    "sentence-transformers>=3.0.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.9",
    "aiohttp>=3.9.0",
    "google-auth>=2.29.0",
    "google-api-python-client>=2.131.0",
    "google-cloud-aiplatform>=1.70.0",
    # providers/gemini_vertex_provider.py imports google.genai directly (the
    # current, non-deprecated Gen AI SDK -- see that module's own doc
    # comment on why NOT vertexai.generative_models). Only present
    # transitively via google-cloud-aiplatform today (confirmed: uv.lock
    # resolves it without this line) -- pinned explicitly for the same real
    # reason pyjwt[crypto] is below: a future google-cloud-aiplatform
    # version dropping or narrowing that transitive requirement should not
    # silently break this import (found in adversarial review).
    "google-genai>=1.0.0",
    "mcp<2,>=1.2.0",
    "honcho-ai>=2.0,<3",
    "defusedxml>=0.7.1",
    "feedparser>=6.0.11",
    "tzdata>=2026.4",
    # Already present transitively (via mcp) with the [crypto] extra, but the
    # IDUNA JWT auth path (auth/iduna_auth.py) depends on it directly for
    # ES256 (EC) verification — pin it explicitly rather than relying on
    # another package's own transitive requirement staying compatible.
    "pyjwt[crypto]>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/SenteLabsAI/OpenExecutive"
Repository = "https://github.com/SenteLabsAI/OpenExecutive"
Issues = "https://github.com/SenteLabsAI/OpenExecutive/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-aiofiles>=23.2.0",
]

[project.scripts]
openexecutive = "openexecutive.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openexecutive"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.13",
]
